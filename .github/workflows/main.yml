name: Publicação automática com Backup e Notificações

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Criar arquivo temporário da chave SSH
        run: |
          echo "${{ secrets.KEY }}" > /tmp/private_key
          chmod 600 /tmp/private_key

      - name: Garantir pastas e permissões na VM
        run: |
          ssh -i /tmp/private_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${{ secrets.HOST }} \
          "sudo mkdir -p /home/ubuntu/gamejava /home/ubuntu/backups && sudo chown -R ubuntu:ubuntu /home/ubuntu/gamejava /home/ubuntu/backups"

      # --- REQUISITO: BACKUP ANTES DA SUBSTITUIÇÃO ---
      - name: Criar Backup da aplicação atual
        run: |
          ssh -i /tmp/private_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${{ secrets.HOST }} \
          "if [ -d '/home/ubuntu/gamejava' ] && [ \"\$(ls -A /home/ubuntu/gamejava)\" ]; then sudo tar -czf /home/ubuntu/backups/gamejava_backup_\$(date +'%Y%m%d_%H%M%S').tar.gz -C /home/ubuntu/gamejava .; fi && sudo chown -R ubuntu:ubuntu /home/ubuntu/backups"

      # --- TRANSFERÊNCIA E COMPILAÇÃO ---
      - name: Transferir novos arquivos da aplicação
        run: |
          scp -i /tmp/private_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -r ${{ github.workspace }}/* ubuntu@${{ secrets.HOST }}:/home/ubuntu/gamejava

      - name: Compilar o código Java na VM
        run: |
          ssh -i /tmp/private_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${{ secrets.HOST }} \
          "cd /home/ubuntu/gamejava && javac Server.java"

      - name: Reiniciar o serviço da aplicação Java
        run: |
          ssh -i /tmp/private_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${{ secrets.HOST }} \
          "sudo systemctl restart gamejava.service"

      - name: Limpar chave privada temporária
        run: |
          rm -f /tmp/private_key

      # --- REQUISITO: NOTIFICAÇÃO DE SUCESSO (SLACK) ---
      - name: Notificar Sucesso (Slack)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ *Deploy realizado com sucesso!*\n- *Repositório:* ${{ github.repository }}\n- *Commit:* ${{ github.sha }}\n- *Servidor:* ${{ secrets.HOST }}"}' \
          "${{ secrets.SLACK }}"

      # --- REQUISITO: NOTIFICAÇÃO DE FALHA (SLACK) ---
      - name: Notificar Falha (Slack)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"🚨 *FALHA NO DEPLOY!*\nO processo de publicação falhou. Verifique os logs no GitHub Actions."}' \
          "${{ secrets.SLACK }}"
